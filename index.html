<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>R.I.S.I.N.G - Flood Monitoring System</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%231a3a6e' width='100' height='100'/><text x='50' y='68' font-size='50' text-anchor='middle' fill='white' font-family='serif' font-weight='bold'>R</text></svg>" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <div id="err" style="display:none;position:fixed;inset:0;background:#0d1f3c;color:#fff;font-family:monospace;padding:20px;font-size:13px;overflow:auto;z-index:99999;white-space:pre-wrap;"></div>
    <script>
      function showAppError() {
        var d = document.getElementById('err')
        d.style.display = 'block'
        d.textContent = 'The dashboard encountered an error. Reload the page to try again.'
      }
      window.onerror = showAppError
      window.onunhandledrejection = showAppError
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
